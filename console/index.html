<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Dispute Court Console</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#case">Skip to case</a>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3v18M5 21h14M6 7h12M6 7l-3 7a3 3 0 0 0 6 0L6 7zm12 0l-3 7a3 3 0 0 0 6 0l-3-7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Dispute Court</span><span class="brand-sub">Operations console</span>
    </div>
    <form class="token" id="token-form" autocomplete="off">
      <label for="token">Operator token</label>
      <input id="token" type="password" placeholder="Held for this session only" autocomplete="off" spellcheck="false">
      <label for="approver" class="sr">Approver name</label>
      <input id="approver" type="text" placeholder="Approver name" autocomplete="off">
      <span class="token-state" id="token-state" aria-live="polite"></span>
    </form>
  </header>
  <div class="layout">
    <nav class="docket" aria-label="Docket">
      <div class="docket-head"><h2>Docket</h2><span class="poll" id="poll" title="Polling every 3 seconds"></span></div>
      <ul id="docket-list" class="docket-list"></ul>
    </nav>
    <main id="case" class="case" tabindex="-1"></main>
  </div>
</body>
</html>
